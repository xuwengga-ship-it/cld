<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本体管理 - Graph Ontology Explorer</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@antv/x6@2.18.1/dist/x6.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@antv/layout@0.3.22/dist/layout.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
    }

    .graph-explorer {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f0f2f5;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 60px;
      padding: 0 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 140px;
      background-color: white;
      border-right: 1px solid #e8e8e8;
      overflow-y: auto;
      padding: 8px 0;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 12px;
      cursor: pointer;
      font-size: 12px;
      color: #666;
      transition: all 0.3s;
    }

    .menu-item:hover {
      background-color: #f5f5f5;
    }

    .menu-item.active {
      background-color: #e6f7ff;
      color: #1890ff;
    }

    .left-panel {
      width: 360px;
      background-color: white;
      border-right: 1px solid #e8e8e8;
      overflow-y: auto;
      padding: 16px;
    }

    .entity-info h3 {
      color: #1890ff;
      margin-bottom: 12px;
      font-size: 18px;
    }

    .entity-type {
      display: inline-block;
      padding: 4px 12px;
      background-color: #f0f0f0;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
      margin-bottom: 16px;
    }

    .detail-item {
      display: flex;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
    }

    .detail-label {
      flex: 0 0 120px;
      color: #999;
    }

    .detail-value {
      flex: 1;
      color: #333;
    }

    .graph-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: white;
      position: relative;
    }

    .toolbar {
      padding: 12px 16px;
      border-bottom: 1px solid #e8e8e8;
      background-color: #fafafa;
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 8px 16px;
      background-color: white;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .btn:hover {
      color: #1890ff;
      border-color: #1890ff;
    }

    .btn.primary {
      background-color: #1890ff;
      color: white;
      border-color: #1890ff;
    }

    .btn.primary:hover {
      background-color: #40a9ff;
    }

    .graph-canvas {
      flex: 1;
      background-color: #fafbfc;
      background-image:
        linear-gradient(#e8e8e8 1px, transparent 1px),
        linear-gradient(90deg, #e8e8e8 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .timeline-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 1200px;
      background-color: white;
      border-radius: 8px;
      padding: 16px 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
    }

    .timeline-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .timeline-slider {
      padding: 0 12px;
    }

    input[type="range"] {
      width: 100%;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .modal.show {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: white;
      padding: 24px;
      border-radius: 8px;
      width: 500px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e8e8e8;
    }

    .modal-footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e8e8e8;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .form-item {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-size: 14px;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 14px;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-menu {
      display: flex;
      flex-direction: column;
    }

    .action-item {
      padding: 12px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      transition: all 0.3s;
    }

    .action-item:hover {
      background-color: #f5f5f5;
    }

    .info-text {
      margin: 12px 0;
      padding: 12px;
      background-color: #e6f7ff;
      border-radius: 4px;
      color: #0958d9;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="graph-explorer">
      <!-- Header -->
      <div class="header">
        <div class="header-left">
          <span>📊</span>
          <span class="title">本体管理</span>
        </div>
        <div class="header-right">
          <span>欢迎您，访问用户</span>
        </div>
      </div>

      <div class="main-content">
        <!-- Sidebar -->
        <div class="sidebar">
          <div class="menu-item">📚<br>课本</div>
          <div class="menu-item">📅<br>单位</div>
          <div class="menu-item">👤<br>主次关系新</div>
          <div class="menu-item active">🔗<br>对象类型</div>
          <div class="menu-item">📦<br>属性</div>
          <div class="menu-item">📈<br>属性类型</div>
        </div>

        <!-- Left Panel -->
        <div class="left-panel" v-if="selectedEntity">
          <div class="entity-info">
            <h3>{{ selectedEntity.name }}</h3>
            <div class="entity-type">{{ selectedEntity.type }}</div>
            <div class="detail-item" v-for="(value, key) in selectedEntity.properties" :key="key">
              <span class="detail-label">{{ key }}:</span>
              <span class="detail-value">{{ value }}</span>
            </div>
          </div>
        </div>

        <!-- Graph Canvas -->
        <div class="graph-container">
          <!-- Toolbar -->
          <div class="toolbar">
            <button class="btn" @click="showAddModal">➕ 新增对象</button>
            <button class="btn" @click="showSearchModal" :disabled="selectedNodes.length === 0">
              🔍 周边搜索
            </button>
            <button class="btn" @click="showActionsModal" :disabled="selectedNodes.length === 0">
              ⚡ 动作
            </button>
            <button class="btn" @click="autoLayout">📐 自动布局</button>
            <button class="btn" @click="fitView">🖼️ 适应画布</button>
            <button class="btn" @click="zoomIn">🔍+ 放大</button>
            <button class="btn" @click="zoomOut">🔍- 缩小</button>
          </div>

          <!-- X6 Graph Canvas -->
          <div ref="graphCanvas" class="graph-canvas"></div>

          <!-- Timeline -->
          <div class="timeline-container">
            <div class="timeline-controls">
              <span>⏰</span>
              <span class="timeline-label">时间轴:</span>
              <button class="btn" @click="timeRange = 'today'">当天</button>
              <button class="btn" @click="timeRange = 'month'">一月</button>
              <button class="btn" @click="timeRange = 'year'">半年</button>
              <button class="btn" @click="timeRange = 'all'">一年</button>
            </div>
            <div class="timeline-slider">
              <input type="range" v-model="timelineValue" min="0" max="100" @change="onTimelineChange">
            </div>
          </div>
        </div>
      </div>

      <!-- Peripheral Search Modal -->
      <div class="modal" :class="{ show: searchModalVisible }">
        <div class="modal-content">
          <div class="modal-header">周边搜索</div>
          <div class="info-text">已选择 {{ selectedNodes.length }} 个节点</div>
          <div class="form-item">
            <label class="form-label">关系类型</label>
            <div class="checkbox-group">
              <div class="checkbox-item" v-for="rel in relationTypes" :key="rel.id">
                <input type="checkbox" :value="rel.id" v-model="selectedRelations">
                <span>{{ rel.name }}</span>
              </div>
            </div>
          </div>
          <div class="form-item">
            <label class="form-label">搜索深度</label>
            <input type="number" v-model="searchDepth" min="1" max="5">
          </div>
          <div class="modal-footer">
            <button class="btn" @click="searchModalVisible = false">取消</button>
            <button class="btn primary" @click="executeSearch">搜索</button>
          </div>
        </div>
      </div>

      <!-- Actions Modal -->
      <div class="modal" :class="{ show: actionsModalVisible }">
        <div class="modal-content">
          <div class="modal-header">对象动作</div>
          <div class="action-menu">
            <div class="action-item" v-for="action in actions" :key="action.id" @click="executeAction(action)">
              {{ action.icon }} {{ action.name }}
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn" @click="actionsModalVisible = false">关闭</button>
          </div>
        </div>
      </div>

      <!-- Add Entity Modal -->
      <div class="modal" :class="{ show: addModalVisible }">
        <div class="modal-content">
          <div class="modal-header">新增对象</div>
          <div class="form-item">
            <label class="form-label">对象类型</label>
            <select v-model="selectedType" @change="loadEntities">
              <option value="">请选择对象类型</option>
              <option v-for="type in ontologyTypes" :key="type.id" :value="type.id">
                {{ type.name }}
              </option>
            </select>
          </div>
          <div class="form-item" v-if="selectedType">
            <label class="form-label">对象实例（多选）</label>
            <div class="checkbox-group">
              <div class="checkbox-item" v-for="entity in availableEntities" :key="entity.id">
                <input type="checkbox" :value="entity.id" v-model="selectedEntities">
                <span>{{ entity.name }}</span>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn" @click="addModalVisible = false">取消</button>
            <button class="btn primary" @click="addEntities">添加到画布</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp } = Vue;
    const { Graph } = X6;
    const { DagreLayout } = Layout;

    createApp({
      data() {
        return {
          graph: null,
          selectedEntity: null,
          selectedNodes: [],
          searchModalVisible: false,
          actionsModalVisible: false,
          addModalVisible: false,
          timeRange: 'all',
          timelineValue: 100,
          selectedRelations: [],
          searchDepth: 2,
          selectedType: '',
          selectedEntities: [],
          relationTypes: [
            { id: 1, name: '拥有' },
            { id: 2, name: '供应' },
            { id: 3, name: '销售' },
            { id: 4, name: '合作' },
            { id: 5, name: '关联' }
          ],
          actions: [
            { id: 1, name: '查看详情', icon: 'ℹ️' },
            { id: 2, name: '编辑信息', icon: '✏️' },
            { id: 3, name: '查看报表', icon: '📊' },
            { id: 4, name: '添加子公司', icon: '➕' }
          ],
          ontologyTypes: [
            { id: 1, name: '公司', color: '#1890FF' },
            { id: 2, name: '供应商', color: '#52C41A' },
            { id: 3, name: '经销商', color: '#FA8C16' }
          ],
          availableEntities: [],
          mockData: {
            nodes: [
              { id: '1', label: '海王集团股份有限公司', type: '公司', color: '#1890FF', x: 400, y: 200,
                properties: {
                  '注册资本': '263112.3257万人民币',
                  '成立日期': '1992-12-13',
                  '法定代表人': '张锋',
                  '统一社会信用代码': '914403001924440861',
                  '人员规模': '100-499人'
                }
              },
              { id: '2', label: '宁波海龙科技有限公司', type: '公司', color: '#1890FF', x: 200, y: 100,
                properties: {
                  '成立日期': '2015-03-20',
                  '员工数': '150人'
                }
              },
              { id: '3', label: '南京科技有限公司', type: '公司', color: '#1890FF', x: 200, y: 300,
                properties: {
                  '成立日期': '2016-08-15',
                  '员工数': '200人'
                }
              },
              { id: '4', label: '供应商A', type: '供应商', color: '#52C41A', x: 600, y: 100,
                properties: {
                  '供应类型': '原材料',
                  '合作年限': '5年'
                }
              },
              { id: '5', label: '供应商B', type: '供应商', color: '#52C41A', x: 600, y: 200,
                properties: {
                  '供应类型': '设备',
                  '合作年限': '3年'
                }
              },
              { id: '6', label: '经销商A', type: '经销商', color: '#FA8C16', x: 600, y: 300,
                properties: {
                  '区域': '华东',
                  '销售额': '1000万'
                }
              }
            ],
            edges: [
              { id: 'e1', source: '1', target: '2', label: '拥有', color: '#1890FF' },
              { id: 'e2', source: '1', target: '3', label: '拥有', color: '#1890FF' },
              { id: 'e3', source: '4', target: '1', label: '供应', color: '#52C41A' },
              { id: 'e4', source: '5', target: '1', label: '供应', color: '#52C41A' },
              { id: 'e5', source: '1', target: '6', label: '销售', color: '#FA8C16' }
            ]
          }
        };
      },
      mounted() {
        this.initGraph();
        this.loadGraphData();
      },
      methods: {
        initGraph() {
          this.graph = new Graph({
            container: this.$refs.graphCanvas,
            autoResize: true,
            panning: { enabled: true },
            mousewheel: { enabled: true, modifiers: 'ctrl' },
            selecting: { enabled: true, multiple: true, rubberband: true }
          });

          this.graph.on('node:click', ({ node }) => {
            const data = node.getData();
            this.selectedEntity = data;
          });

          this.graph.on('selection:changed', ({ selected }) => {
            this.selectedNodes = selected.map(cell => cell.id);
          });
        },
        loadGraphData() {
          this.graph.clearCells();

          this.mockData.nodes.forEach(node => {
            this.graph.addNode({
              id: node.id,
              x: node.x,
              y: node.y,
              width: 180,
              height: 60,
              shape: 'rect',
              attrs: {
                body: {
                  fill: node.color,
                  stroke: '#0050B3',
                  strokeWidth: 2,
                  rx: 6,
                  ry: 6
                },
                label: {
                  text: node.label,
                  fill: '#fff',
                  fontSize: 13,
                  textWrap: { width: 170, ellipsis: true }
                }
              },
              data: node
            });
          });

          this.mockData.edges.forEach(edge => {
            this.graph.addEdge({
              id: edge.id,
              source: edge.source,
              target: edge.target,
              attrs: {
                line: {
                  stroke: edge.color,
                  strokeWidth: 2,
                  targetMarker: { name: 'block', width: 12, height: 8 }
                }
              },
              labels: [{
                attrs: {
                  label: { text: edge.label, fill: '#666', fontSize: 12 },
                  body: { fill: '#fff', stroke: '#ccc', rx: 4, ry: 4 }
                }
              }],
              data: edge
            });
          });
        },
        autoLayout() {
          const nodes = this.graph.getNodes();
          const edges = this.graph.getEdges();

          const layout = new DagreLayout({
            type: 'dagre',
            rankdir: 'LR',
            nodesep: 50,
            ranksep: 100
          });

          const model = {
            nodes: nodes.map(node => ({
              id: node.id,
              width: node.size().width,
              height: node.size().height
            })),
            edges: edges.map(edge => ({
              source: edge.getSourceCellId(),
              target: edge.getTargetCellId()
            }))
          };

          const newModel = layout.layout(model);
          newModel.nodes.forEach(node => {
            const cell = this.graph.getCellById(node.id);
            if (cell) cell.position(node.x, node.y);
          });

          alert('自动布局完成！');
        },
        fitView() {
          this.graph.zoomToFit({ padding: 50, maxScale: 1 });
        },
        zoomIn() {
          this.graph.zoom(0.2);
        },
        zoomOut() {
          this.graph.zoom(-0.2);
        },
        showSearchModal() {
          if (this.selectedNodes.length === 0) {
            alert('请先选择节点');
            return;
          }
          this.searchModalVisible = true;
        },
        executeSearch() {
          const newNodes = [
            { id: '7', label: '中国医药集团', type: '公司', color: '#1890FF', x: 800, y: 200,
              properties: { '成立日期': '2000-01-01', '员工数': '1000人' }
            },
            { id: '8', label: '供应商C', type: '供应商', color: '#52C41A', x: 800, y: 100,
              properties: { '供应类型': '服务', '合作年限': '2年' }
            }
          ];

          const newEdges = [
            { id: 'e6', source: '1', target: '7', label: '合作', color: '#722ED1' },
            { id: 'e7', source: '8', target: '7', label: '供应', color: '#52C41A' }
          ];

          newNodes.forEach(node => {
            if (!this.graph.getCellById(node.id)) {
              this.mockData.nodes.push(node);
              this.graph.addNode({
                id: node.id,
                x: node.x,
                y: node.y,
                width: 180,
                height: 60,
                shape: 'rect',
                attrs: {
                  body: {
                    fill: node.color,
                    stroke: '#0050B3',
                    strokeWidth: 2,
                    rx: 6,
                    ry: 6
                  },
                  label: {
                    text: node.label,
                    fill: '#fff',
                    fontSize: 13
                  }
                },
                data: node
              });
            }
          });

          newEdges.forEach(edge => {
            if (!this.graph.getCellById(edge.id)) {
              this.mockData.edges.push(edge);
              this.graph.addEdge({
                id: edge.id,
                source: edge.source,
                target: edge.target,
                attrs: {
                  line: {
                    stroke: edge.color,
                    strokeWidth: 2,
                    targetMarker: { name: 'block' }
                  }
                },
                labels: [{
                  attrs: {
                    label: { text: edge.label, fill: '#666', fontSize: 12 }
                  }
                }]
              });
            }
          });

          this.searchModalVisible = false;
          alert(`周边搜索完成！发现 ${newNodes.length} 个新节点`);
        },
        showActionsModal() {
          if (this.selectedNodes.length === 0) {
            alert('请先选择节点');
            return;
          }
          this.actionsModalVisible = true;
        },
        executeAction(action) {
          alert(`执行动作: ${action.name}`);
          this.actionsModalVisible = false;
        },
        showAddModal() {
          this.addModalVisible = true;
        },
        loadEntities() {
          const entities = {
            1: [
              { id: 'c1', name: '阿里巴巴集团' },
              { id: 'c2', name: '腾讯控股' },
              { id: 'c3', name: '百度公司' }
            ],
            2: [
              { id: 's1', name: '供应商D' },
              { id: 's2', name: '供应商E' }
            ],
            3: [
              { id: 'd1', name: '经销商B' },
              { id: 'd2', name: '经销商C' }
            ]
          };
          this.availableEntities = entities[this.selectedType] || [];
        },
        addEntities() {
          if (this.selectedEntities.length === 0) {
            alert('请选择至少一个对象实例');
            return;
          }

          const typeInfo = this.ontologyTypes.find(t => t.id == this.selectedType);
          const entities = this.availableEntities.filter(e =>
            this.selectedEntities.includes(e.id)
          );

          entities.forEach((entity, index) => {
            const node = {
              id: entity.id,
              label: entity.name,
              type: typeInfo.name,
              color: typeInfo.color,
              x: 400 + index * 200,
              y: 400,
              properties: { '类型': typeInfo.name }
            };

            this.mockData.nodes.push(node);
            this.graph.addNode({
              id: node.id,
              x: node.x,
              y: node.y,
              width: 180,
              height: 60,
              shape: 'rect',
              attrs: {
                body: {
                  fill: node.color,
                  stroke: '#0050B3',
                  strokeWidth: 2,
                  rx: 6,
                  ry: 6
                },
                label: {
                  text: node.label,
                  fill: '#fff',
                  fontSize: 13
                }
              },
              data: node
            });
          });

          this.addModalVisible = false;
          this.selectedEntities = [];
          this.selectedType = '';
          alert(`成功添加 ${entities.length} 个对象到画布！`);
        },
        onTimelineChange() {
          alert(`时间轴切换到: ${this.timelineValue}%`);
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
